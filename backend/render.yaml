services:
  - type: web
    name: scholar-agent-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Requires manual insertion of Supabase connection string securely in the dashboard
      - key: SUPABASE_KEY
        sync: false
